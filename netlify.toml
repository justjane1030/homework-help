# Netlify config — no build step, just publish this folder as-is.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Never cache index.html, so a new deploy shows up immediately on phones.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
